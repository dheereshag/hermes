name: Compile ARM64 & Publish Release Branch

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install System Compiler & ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ccache patchelf

      - name: Cache Compiler State (ccache)
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-aarch64-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-aarch64-ccache-

      - name: Setup uv Package Manager
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Setup Python Runtime
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install Dependencies
        run: uv sync

      - name: Run Test Suite
        run: uv run pytest

      - name: Run Nuitka Build (Hermes Core Package)
        run: |
          uv run python -m nuitka \
            --module \
            --include-package=src \
            --nofollow-imports \
            --remove-output \
            --lto=yes \
            --python-flag=no_docstrings \
            --output-dir=compiled_dist \
            src

      - name: Verify Compiled Module Import
        run: |
          mkdir -p test_verify/src/web
          cp compiled_dist/src.*.so test_verify/
          cp -r src/web/templates test_verify/src/web/
          cd test_verify
          uv run python -c "import src; from src.config import config; from src.web import create_app; print('SUCCESS: Native ARM64 Hermes src module loaded!')"

      - name: Upload Artifact Backup
        uses: actions/upload-artifact@v7
        with:
          name: hermes-arm64-compiled
          path: compiled_dist/src.*.so
          retention-days: 14

      - name: Deploy to release-arm64 Branch
        run: |
          git config user.name "dheereshag"
          git config user.email "da11@iitbbs.ac.in"

          # Stage release artifacts to a temporary directory
          RELEASE_DIR=$(mktemp -d)
          cp compiled_dist/src.*.so "${RELEASE_DIR}/"
          cp main.py pyproject.toml uv.lock README.md .python-version "${RELEASE_DIR}/"
          mkdir -p "${RELEASE_DIR}/src/web"
          cp -r src/web/templates "${RELEASE_DIR}/src/web/"
          [ -f .env.example ] && cp .env.example "${RELEASE_DIR}/"
          [ -f .gitignore ] && cp .gitignore "${RELEASE_DIR}/"

          # Switch to orphan deployment branch and clean
          git branch -D release-arm64 2>/dev/null || true
          git checkout --orphan release-arm64
          git rm -rf .
          git clean -fdx

          # Restore only release distribution files
          cp -a "${RELEASE_DIR}/." ./
          rm -rf "${RELEASE_DIR}"

          # Stage files and push
          git add -f src.*.so
          git add .
          git commit -m "build(arm64): release compiled binary for ${GITHUB_SHA:0:7} [skip ci]"
          git push -f origin release-arm64
